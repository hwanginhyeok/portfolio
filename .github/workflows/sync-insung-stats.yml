name: Sync Insung Stats

# 인성이프로젝트 Supabase에서 실 운영 지표를 가져와
# src/data/insung_stats.json을 갱신하고 커밋한다.
# JSON이 바뀌면 deploy.yml(master push trigger)이 자동으로 발동된다.

on:
  schedule:
    # 매주 일요일 03:00 UTC (KST 12:00)
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update stats from Supabase
        env:
          INSUNG_SUPABASE_URL: ${{ secrets.INSUNG_SUPABASE_URL }}
          INSUNG_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.INSUNG_SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/update_insung_stats.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet src/data/insung_stats.json; then
            echo "변경 없음 — 커밋 스킵"
          else
            git add src/data/insung_stats.json
            git commit -m "chore(stats): 인성이 운영 지표 자동 갱신 [skip-deploy-noop]"
            git push
          fi
