<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" role="img" aria-label="모으기, 만들기, 승인 대기, 올리기" font-family="system-ui, -apple-system, 'Noto Sans KR', sans-serif">
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#475569"/></marker></defs>
  <rect width="760" height="190" fill="#fff"/>
  <g font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">
    <rect x="8" y="30" width="150" height="76" rx="10" fill="#f1f5f9" stroke="#64748b"/><text x="83" y="62">모으기</text><text x="83" y="84" font-size="11" font-weight="400" fill="#334155">뉴스·지표 수집</text>
    <rect x="200" y="30" width="150" height="76" rx="10" fill="#f1f5f9" stroke="#64748b"/><text x="275" y="62">만들기</text><text x="275" y="84" font-size="11" font-weight="400" fill="#334155">내 템플릿으로 카드·릴스</text>
    <rect x="392" y="30" width="170" height="76" rx="10" fill="#fef3c7" stroke="#d97706"/><text x="477" y="62">승인 대기</text><text x="477" y="84" font-size="11" font-weight="400" fill="#334155">내가 보고 영수증을 남긴다</text>
    <rect x="604" y="30" width="148" height="76" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="678" y="62">올리기</text><text x="678" y="84" font-size="11" font-weight="400" fill="#334155">영수증이 있을 때만</text>
  </g>
  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a)"><path d="M160 68 H198"/><path d="M352 68 H390"/><path d="M564 68 H602"/></g>
  <rect x="200" y="128" width="552" height="30" rx="8" fill="#fff" stroke="#d97706" stroke-dasharray="5 4"/>
  <text x="476" y="148" font-size="12" fill="#92400e" text-anchor="middle">제어 계층: 권한 · 승인 · 영수증 관문 — 영수증이 없으면 올리기 API는 실행되지 않는다</text>
  <text x="8" y="182" font-size="11" fill="#64748b">설계에서 그린 그림 · 실제 화면 아님</text>
</svg>
