  <g fill="#fff" stroke="#16a34a" stroke-width="2"><circle cx="530" cy="94" r="14"/><circle cx="574" cy="94" r="14"/><circle cx="618" cy="94" r="14"/><circle cx="662" cy="94" r="14"/><circle cx="706" cy="94" r="14"/></g>
  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a)"><path d="M180 80 H228"/><path d="M432 80 H480"/></g>
  <text x="8" y="160" font-size="12" fill="#334155">자리가 비면 다음 번호가 들어온다 → DB 연결 수는 일정한 선을 넘지 않고, 같은 거북이를 두 번 팔지 않는다.</text>
  <text x="8" y="198" font-size="11" fill="#64748b">설계에서 그린 그림 · 실제 화면 아님</text>
