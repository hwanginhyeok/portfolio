<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" role="img" aria-label="좌판당 5석과 번호표 대기열" font-family="system-ui, -apple-system, 'Noto Sans KR', sans-serif">
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#475569"/></marker></defs>
  <rect width="760" height="210" fill="#fff"/>
  <g font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">
    <rect x="8" y="40" width="170" height="80" rx="10" fill="#f1f5f9" stroke="#64748b"/><text x="93" y="72">손님들</text><text x="93" y="94" font-size="11" font-weight="400" fill="#334155">한꺼번에 들어온다</text>
    <rect x="230" y="40" width="200" height="80" rx="10" fill="#fef3c7" stroke="#d97706"/><text x="330" y="72">번호표 대기열</text><text x="330" y="94" font-size="11" font-weight="400" fill="#334155">순서대로 들인다</text>
