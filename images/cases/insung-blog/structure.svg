<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-label="글쓴이 브라우저의 Chrome 확장과 서버의 역할 분리" font-family="system-ui, -apple-system, 'Noto Sans KR', sans-serif">
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#475569"/></marker></defs>
  <rect width="760" height="250" fill="#fff"/>
  <rect x="8" y="8" width="300" height="214" rx="14" fill="#ecfdf5" stroke="#16a34a"/>
  <text x="24" y="32" font-size="13" font-weight="700" fill="#166534">글쓴이 브라우저 — 로그인과 게시는 여기서만</text>
  <g font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">
    <rect x="30" y="52" width="256" height="58" rx="10" fill="#fff" stroke="#16a34a"/><text x="158" y="78">인성이 웹 (사진·메모 입력)</text><text x="158" y="96" font-size="11" font-weight="400" fill="#334155">리뷰 쓰기 · 말투 고르기 · 최종 확인</text>
    <rect x="30" y="134" width="256" height="62" rx="10" fill="#fff" stroke="#16a34a"/><text x="158" y="160">Chrome 확장 (Manifest V3)</text><text x="158" y="178" font-size="11" font-weight="400" fill="#334155">네이버 화면에서 직접 등록</text>
  </g>
  <rect x="380" y="8" width="372" height="214" rx="14" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="396" y="32" font-size="13" font-weight="700" fill="#334155">서버 — AI 생성과 DB만</text>
  <g font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">
    <rect x="400" y="52" width="150" height="58" rx="10" fill="#fff" stroke="#64748b"/><text x="475" y="78">API 서버</text><text x="475" y="96" font-size="11" font-weight="400" fill="#334155">FastAPI · Vercel · 글 만들기</text>
    <rect x="582" y="52" width="150" height="58" rx="10" fill="#fff" stroke="#64748b"/><text x="657" y="78">AI 모델</text><text x="657" y="96" font-size="11" font-weight="400" fill="#334155">사진 읽기 · 초안</text>
    <rect x="400" y="134" width="332" height="62" rx="10" fill="#fff" stroke="#64748b"/><text x="566" y="160">Supabase (DB · 파일)</text><text x="566" y="178" font-size="11" font-weight="400" fill="#334155">제어 평면 — 상태와 결과를 한 곳에</text>
  </g>
  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M158 112 V132"/><path d="M288 81 H398"/><path d="M552 81 H580"/><path d="M475 112 V132"/>
  </g>
  <text x="8" y="244" font-size="11" fill="#64748b">설계에서 그린 그림 · 실제 화면 아님</text>
</svg>
